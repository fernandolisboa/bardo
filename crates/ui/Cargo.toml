[package]
name = "bardo-ui"
description = "GPUI views and components. The only crate allowed to depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "bardo"

[[bin]]
name = "bardo"
path = "src/main.rs"

[dependencies]
bardo-app.workspace = true
bardo-storage.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
# Preview frames become RenderImages (ADR-0007).
image = { version = "0.25", default-features = false }
sys-locale = "0.3"

# For examples/preview_probe.rs, a frame-to-screen measurement (issue #18).
[dev-dependencies]
bardo-media.workspace = true
cpu-time = "1"

[lints]
workspace = true
