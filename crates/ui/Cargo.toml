[package]
name = "bardo-ui"
description = "GPUI views and components. The only crate allowed to depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "bardo"

[[bin]]
name = "bardo"
path = "src/main.rs"

[dependencies]
bardo-app.workspace = true
bardo-storage.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
# Preview frames become RenderImages (ADR-0007); the X11 window icon is a PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# `bardo --showcase <folder>`: the look job's walk through every screen
# (issue #166, e2e/README.md). Never in a build a user gets.
showcase = ["dep:serde", "dep:serde_json"]

# Embeds the window and taskbar icon in bardo.exe on Windows (issue #131).
[build-dependencies]
embed-resource = "3"

# For examples/preview_probe.rs, a frame-to-screen measurement (issue #18).
[dev-dependencies]
bardo-media.workspace = true
cpu-time = "1"

[lints]
workspace = true
