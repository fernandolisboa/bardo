[package]
name = "bardo-app"
description = "Application state, use cases, job queue and orchestration. The UI's only entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The settings file's password and sealing (issue #162, ADR-0014).
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.3"
base64.workspace = true
bardo-domain.workspace = true
bardo-media.workspace = true
bardo-ai.workspace = true
bardo-publish.workspace = true
bardo-storage.workspace = true
bardo-vision.workspace = true
dirs.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# Checks a downloaded update against its release (issue #144).
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true
zip.workspace = true

# The Windows version in an exported diagnostic (issue #140).
[target.'cfg(windows)'.dependencies]
windows-version.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
