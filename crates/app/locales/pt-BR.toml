[tour.welcome.settings]
title = "Comece pelas chaves"
body = "O Bardo usa as suas próprias contas de IA, então comece adicionando suas chaves de API em Configurações. Elas ficam no Gerenciador de Credenciais do Windows, nunca no banco de dados do Bardo."

[tour.welcome.jobs]
title = "Tarefas"
body = "Trabalho longo, como narração, imagens ou um render, roda como tarefa. Continue usando o Bardo enquanto isso, e acompanhe, cancele ou retome cada tarefa aqui."

[tour.welcome.costs]
title = "Custos e orçamentos"
body = "Quanto você gastou neste mês e quanto dos seus orçamentos já foi usado. Defina um orçamento mensal para cada provedor na tela Custos."

[tour.welcome.guide]
title = "Guia e tours"
body = "Volte aqui para refazer este tour, retomar um que você fechou, ver os atalhos de teclado ou ler o guia do usuário. F1 abre o guia em qualquer tela."

[tour.research]
name = "Tour da Pesquisa"

[tour.research.channel]
title = "Canal e mercado"
body = "A pesquisa roda para um canal. O país-alvo e o idioma do conteúdo dele definem o mercado: os números vêm dos uploads do YouTube nesse país e idioma."

[tour.research.seeds]
title = "Nichos ou palavras-chave"
body = "Digite um nicho ou palavra-chave por linha, até 20. Cada um vira uma busca no YouTube, então escreva do jeito que o público buscaria."

[tour.research.run]
title = "Pesquisar e atualizar"
body = "O botão Pesquisar consulta cada nicho, usando cerca de 1% da sua cota diária do YouTube por nicho. Os resultados ficam guardados por 7 dias, então pesquisar de novo dentro de uma semana não custa nada; Atualizar tudo busca todos os nichos outra vez."

[tour.research.results]
title = "Resultados ranqueados"
body = "Os nichos são ranqueados pela oportunidade, que pesa a tendência contra a concorrência. Cada cartão mostra os números por trás das notas e quando foram buscados."

[tour.research.next]
title = "Próximo passo: temas"
body = "Achou um nicho promissor? Em Temas, o Claude sugere ideias de vídeo para ele e as ranqueia para o seu canal."

[tour.themes]
name = "Tour dos Temas"

[tour.themes.pick]
title = "Canal e nicho"
body = "As ideias são escritas para um canal e um dos nichos dele: o nicho do próprio canal ou um que você pesquisou. As notas da pesquisa do nicho aparecem aqui quando existem."

[tour.themes.suggest]
title = "Sugerir temas"
body = "O Claude propõe ideias de vídeo para o nicho e depois o motor de decisão as ranqueia. O botão Ranquear de novo só ranqueia as ideias que estão esperando, como as que você editou. O custo aparece antes de qualquer execução."

[tour.themes.idea]
title = "Uma ideia e sua prioridade"
body = "As ideias aparecem por prioridade, de 0 a 100. A confiança diz o quanto o motor de decisão teve certeza da sua resposta menos segura."

[tour.themes.reasons]
title = "Por que ela está ali"
body = "A prioridade pesa o encaixe com o canal, a tendência e o espaço que a concorrência deixa. Quando seus vídeos publicados têm métricas, o desempenho passado também conta. Detalhes mostra os números usados."

[tour.themes.review]
title = "Aprovar, editar ou descartar"
body = "Aprovar uma ideia começa um projeto de vídeo a partir dela. Editar o título ou o ângulo apaga o ranqueamento, então ranqueie de novo depois. Ideias descartadas saem da lista."

[tour.themes.projects]
title = "Seus projetos"
body = "Os projetos começados a partir das ideias deste canal. Abra-os em Projetos para escrever o roteiro e seguir em frente."

[tour.performance]
name = "Tour do Desempenho"

[tour.performance.channel]
title = "Um canal por vez"
body = "Escolha o canal cujas publicações você acompanha. Os números dele somam os dados mais recentes de todas as publicações."

[tour.performance.posts]
title = "Publicações vinculadas"
body = "Cada publicação vinculada a um projeto do canal, da mais nova para a mais antiga, com a rede e as visualizações. Uma publicação marcada como “Não encontrado” foi removida ou ficou privada."

[tour.performance.numbers]
title = "Os números de uma publicação"
body = "Escolha uma publicação para ver os números dela, quanto mudaram desde a sincronização anterior e o histórico. Com a conta do YouTube do canal conectada, entram também visualizações engajadas, tempo de exibição, retenção e receita."

[tour.performance.drops]
title = "Onde o público sai"
body = "As quedas mais íngremes da curva de retenção de uma publicação do YouTube, cada uma com a cena e a frase do corte que tocam ali. Mostrar no editor abre o editor do projeto nessa queda."

[tour.performance.sync]
title = "Sincronizar agora"
body = "Uma sincronização lê os números mais recentes de cada publicação vinculada, como tarefa. O Bardo também sincroniza sozinho quando abre, conforme Configurações › Métricas."

[tour.performance.link]
title = "Vincular uma publicação"
body = "As publicações são vinculadas na etapa Publicação de um projeto: os envios feitos pelo Bardo se vinculam sozinhos, e para uma exportação você cola o link da publicação. Desvincule ali também; a publicação continua na rede."

[tour.projects]
name = "Tour dos Projetos"

[tour.projects.switcher]
title = "Seu projeto de vídeo"
body = "O projeto em que você está trabalhando, com o menu que troca para outro projeto do canal. O seletor de canal ao lado de Projetos lista os projetos de outro canal."

[tour.projects.narrator]
title = "Quem narra"
body = "O narrador lê a narração deste vídeo e dá forma ao roteiro. É a persona padrão do canal, a menos que você escolha outra só para este vídeo."

[tour.projects.format]
title = "Short ou longo"
body = "Um Short é um vídeo vertical de menos de um minuto; um vídeo longo é 16:9 e tem de 8 a 10 minutos. O projeto segue o canal, a não ser que você escolha o outro aqui. Isso define o tamanho do próximo roteiro, o formato das próximas imagens e dos novos cortes, e o preset do YouTube."

[tour.projects.mode]
title = "Como é produzido, e quanto custa"
body = "O modo diz quais cenas viram clipes de IA e com qual modelo: Econômico mantém imagens com movimento, Gancho animado anima os primeiros 10 segundos, Tudo animado e premium animam todas as cenas. Cada opção mostra quanto o vídeo inteiro custaria antes de gerar qualquer coisa, e o teto faz o Bardo perguntar antes de um passo que passaria dele."

[tour.projects.stages]
title = "As etapas"
body = "Roteiro, narração, cenas, clipes, edição, render e publicação, nessa ordem. A linha sob cada etapa diz como ela está: pronta, gerando, para revisar, desatualizada ou o que ela espera."

[tour.projects.unlock]
title = "Como uma etapa se abre"
body = "Uma etapa se abre assim que a anterior lhe dá com o que trabalhar: a narração lê o roteiro, e as cenas são cronometradas pela narração. Mude uma etapa anterior e o que foi feito a partir dela aparece como desatualizado."

[tour.projects.cost]
title = "Quanto já custou"
body = "A linha sob o nome do projeto mostra o nicho, quando ele começou e quanto já custou, somando cada chamada paga, do roteiro aos clipes. Em Custos ficam os detalhes e os seus orçamentos."

[tour.script]
name = "Tour do Roteiro"

[tour.script.write]
title = "Gere e depois edite"
body = "O Claude escreve o roteiro a partir do modelo de roteiro, do canal, do tema e do narrador. Depois que ele chega aqui, edite à vontade: o roteiro é seu."

[tour.script.review]
title = "Uma nova versão para revisar"
body = "Gerar de novo escreve um novo roteiro sem mexer no seu. Ele espera ao lado do atual até você aceitá-lo ou manter o atual."

[tour.script.save]
title = "Salve suas edições"
body = "Salvar guarda o que você digitou, e Descartar alterações volta ao roteiro salvo. Uma narração feita a partir de um roteiro anterior passa a aparecer como desatualizada."

[tour.script.cost]
title = "Quanto custa"
body = "Antes de gerar, o Bardo estima quanto a chamada vai custar pelas tarifas do provedor. Uma chamada que passaria de um orçamento pergunta antes."

[tour.script.details]
title = "De onde ele veio"
body = "Detalhes diz qual modelo de IA escreveu o roteiro, a partir de qual versão do modelo de roteiro e com quantos tokens. Mostrar prompt mostra exatamente o que foi enviado."

[tour.script.music]
title = "A música"
body = "O Claude escreve um prompt para a música do vídeo a partir do canal, do tema e da duração. Edite-o; depois Gerar música faz o ElevenLabs Music compor uma faixa para revisar, ou faça a música numa ferramenta sua."

[tour.script.versions]
title = "Versões em outros idiomas"
body = "Faça o vídeo de novo para um canal em outro idioma ou país. O Claude adapta o roteiro frase por frase; a versão mantém estas cenas e o corte e ganha narração própria."

[tour.narration]
name = "Tour da Narração"

[tour.narration.generate]
title = "Gere a narração"
body = "O narrador lê o roteiro atual com a voz e os presets dele na ElevenLabs. A ElevenLabs cobra por caractere, e o ⓘ diz quantos antes de você começar."

[tour.narration.play]
title = "Ouça"
body = "A palavra falada fica destacada enquanto a narração toca. Clique em qualquer palavra para tocar a partir dela."

[tour.narration.stale]
title = "Desatualizada"
body = "Quando o roteiro muda depois que a narração foi feita, ela é marcada como Desatualizada. Gere de novo ou importe uma nova gravação para que os dois batam; Detalhes diz como ela foi feita."

[tour.narration.import]
title = "Importe uma gravação"
body = "Gravou o roteiro você mesmo? Importe em MP3 ou WAV, e a ElevenLabs marca o tempo de cada palavra conforme o roteiro."

[tour.narration.capture]
title = "Importe uma captura"
body = "Você se gravou lendo o roteiro diante da câmera? Importe o vídeo: a fala vira a narração, na voz da persona ou na sua, e a gravação é dividida em tomadas."

[tour.capture]
name = "Tour da captura"

[tour.capture.recording]
title = "Sua gravação"
body = "A gravação que você importou, a voz que a fala recebeu e a frase que você confirmou. A fala dela é a narração do projeto."

[tour.capture.test]
title = "O teto e uma tomada de teste"
body = "Quanto as tomadas interpretadas deste vídeo já custaram e ainda precisam, comparado ao teto (US$ 10, a não ser que você mude): acima dele, o Bardo pergunta antes de uma tomada paga. Depois, alguns segundos de uma tomada que passou nas checagens, na opção mais barata do modelo: rascunhos e versões finais esperam até você aprovar um teste para a aparência atual da persona."

[tour.capture.takes]
title = "As tomadas"
body = "A gravação é dividida em tomadas de 4 a 30 segundos em fins de frase e pausas. Cada uma vira um clipe interpretado; uma tomada que não pode virar diz por quê. Cortar antes ou Cortar depois, entre duas tomadas, move o corte delas."

[tour.capture.analysis]
title = "O modo e a análise"
body = "Gravação, Malha ou Profundidade: o que o modelo de tomada recebe desta tomada. O Bardo analisa cada tomada neste computador, de graça, na placa de vídeo quando pode. Cada parte mostra o progresso e o tempo que falta; as checagens abaixo dizem o que gravar de novo."

[tour.capture.control]
title = "O vídeo de controle"
body = "O que o modelo de tomada recebe desta tomada, montado aqui de graça depois da análise. Reproduza, leia o que sai do computador e aprove: nada é pago por uma tomada antes disso."

[tour.capture.performed]
title = "O clipe interpretado"
body = "O modelo de tomada faz a persona interpretar a tomada aprovada: o Claude escreve o prompt, checagens grátis dizem o que corrigir antes, um rascunho vem quando o modelo faz um (opcional quando a versão final é uma tomada nova), depois a versão final. Assista a cada um com a voz da tomada; Usar adiciona a versão final à aba Mídia do editor."

[tour.capture.remove]
title = "Remova"
body = "Remover a captura tira a gravação e suas tomadas do projeto. A narração feita com ela fica."

[tour.scenes]
name = "Tour das Cenas"

[tour.scenes.plan]
title = "Planeje e desenhe"
body = "Planejar cenas divide a narração em cenas pelas frases e escreve um prompt de imagem para cada uma. Depois desenhe as imagens que faltam de uma vez; a estimativa fica sob o botão."

[tour.scenes.list]
title = "As cenas"
body = "Cada cena em ordem, com o tempo, a imagem e como está: para desenhar, para revisar, com falha ou pronta. ↑ e ↓ percorrem as cenas."

[tour.scenes.scene]
title = "Uma cena"
body = "A cena escolhida: o trecho da narração que ela cobre, a imagem e o prompt de imagem, e as pessoas que voltam no vídeo com os retratos de referência, para que fiquem iguais em toda cena. Edite o prompt para mudar o que o próximo desenho mostra."

[tour.scenes.redraw]
title = "Desenhe de novo"
body = "Desenhar de novo faz uma nova imagem a partir do prompt. Ela espera ao lado da atual até você usá-la ou manter a atual."

[tour.scenes.filter]
title = "Todas ou pendentes"
body = "Pendentes mostra só as cenas com algo por fazer, uma imagem para desenhar ou revisar. Todas mostra cada uma."

[tour.scenes.replan]
title = "Planeje de novo"
body = "Quando a narração é feita de novo, as cenas ficam desatualizadas, porque os tempos delas não batem mais. Planejar de novo as substitui, e pergunta antes quando isso descartaria imagens ou clipes."

[tour.scenes.place]
title = "Posicionar as cenas"
body = "Numa versão, depois que a narração dela fica pronta, Posicionar cenas leva cada cena do original ao novo tempo da sua frase e monta o corte como o original estava."

[tour.clips]
name = "Tour dos Clipes"

[tour.clips.animate]
title = "Anime as cenas"
body = "Um clipe anima a imagem de uma cena num vídeo curto, com a duração da narração da cena, dentro do que o modelo permite. Anime de uma vez todas as cenas sem clipe, ou uma cena por vez."

[tour.clips.motion]
title = "Movimento"
body = "Como a imagem se move: um movimento de câmera e no máximo uma ação simples. O Claude o escreve com as cenas; edite-o para mudar o próximo clipe."

[tour.clips.model]
title = "Modelo de vídeo"
body = "Cada cena usa o modelo de vídeo do canal, a menos que você escolha outro para ela aqui. Os modelos mudam no visual, na duração e no preço."

[tour.clips.review]
title = "Revise um novo clipe"
body = "Um novo clipe espera ao lado do atual; reproduza-o antes de usar. Uma cena sem clipe fica com a imagem parada, e Usar a imagem parada volta para ela."

[tour.clips.cost]
title = "Quanto custa um clipe"
body = "Quanto vai durar o próximo clipe da cena e quanto ele custa pela tarifa do provedor, antes de você animar. O provedor cobra cada segundo."

[tour.personas]
name = "Tour das Personas"

[tour.personas.library]
title = "Seus narradores"
body = "Personas são narradores que você reutiliza entre canais: quatro vêm com o Bardo, e você pode criar as suas. Escolha uma para editá-la."

[tour.personas.voice]
title = "A voz"
body = "Uma persona fala com uma voz da sua conta na ElevenLabs. Escolher entre minhas vozes da ElevenLabs lista as vozes, com uma prévia gratuita de cada uma."

[tour.personas.style]
title = "Tom e estilo de roteiro"
body = "O tom diz como o narrador soa; o estilo de roteiro, como os roteiros são escritos para ele. O Claude lê os dois quando escreve um roteiro."

[tour.personas.presets]
title = "Presets de geração"
body = "Estabilidade, similaridade, exagero de estilo e velocidade definem como a ElevenLabs lê com esta voz. Ouvir com estes ajustes toca uma amostra curta antes de você salvar."

[tour.personas.share]
title = "Salve e compartilhe"
body = "Salve, duplique ou exporte a persona para um arquivo, para usar em outro computador; Importar de arquivo, no topo, traz uma de volta. O pacote guarda uma referência à voz, nunca áudio ou chaves."

[tour.personas.realistic]
title = "Voz realista"
body = "Marque quando a voz soa como uma pessoa real, como um clone. As redes pedem que esses vídeos sejam marcados como conteúdo sintético, e o Bardo lembra você na exportação."

[tour.personas.look]
title = "Aparência"
body = "Como esta persona aparece nos clipes de atuação. Desenhe um personagem original a partir de uma descrição, revise e fique com ele, ou importe uma foto sua. Uma foto sua nunca vai num pacote. Para o Seedance na BytePlus, a aparência também pode ir pelo id dela na sua biblioteca de assets do ModelArk."

[tour.templates]
name = "Tour dos Modelos"

[tour.templates.kinds]
title = "Tipos de modelo"
body = "Um modelo é um prompt que o Bardo envia à IA: para o roteiro, os prompts de imagem das cenas, o prompt de música e os metadados da publicação. Escolha o tipo que quer editar."

[tour.templates.versions]
title = "Versões"
body = "Cada vez que você salva, entra uma versão: a mais nova é a atual, e as anteriores ficam. Escolha uma para carregar o texto dela; cada geração registra a versão que usou."

[tour.templates.fields]
title = "Instruções e prompt"
body = "As instruções são as regras fixas: papel, tom e formato. O prompt é a tarefa em si, com os dados do projeto."

[tour.templates.variables]
title = "Variáveis"
body = "Escreva uma variável como {{nome}}, e cada geração a troca pelo valor do projeto. Só funcionam as listadas aqui."

[tour.templates.save]
title = "Salve ou recomece"
body = "Salvar como nova versão guarda as suas mudanças como a próxima versão. Carregar o padrão do Bardo põe o texto original de volta no editor, para salvar se você quiser."

[tour.editor]
name = "Tour do editor"

[tour.editor.preview]
title = "Prévia e reprodução"
body = "A prévia toca o corte a partir de cópias leves das suas mídias, então começa na hora; o render usa os arquivos completos. Espaço toca e pausa, e ← e → andam um quadro. Começar este tour pausou a reprodução."

[tour.editor.tracks]
title = "A linha do tempo"
body = "O corte corre da esquerda para a direita em cinco faixas: legendas, vídeo, narração, música e efeitos sonoros. Clique para mover o cursor de reprodução, e clique num item para selecioná-lo e vê-lo no inspetor. Ctrl e a roda do mouse dão zoom."

[tour.editor.tools]
title = "Cortar"
body = "Dividir (S) corta no cursor de reprodução. Arraste a ponta de um item, ou aperte [ ou ], para apará-lo; arraste um clipe entre outros dois para reordená-lo; Delete remove a seleção. A faixa de vídeo fecha os vãos, e o áudio deixa silêncio."

[tour.editor.transitions]
title = "Transições"
body = "Transição (T) põe a transição do seu canal no corte mais perto do cursor: uma fusão, uma passagem pelo preto ou pelo branco, uma cortina, um deslize ou um zoom. Selecione o clipe depois de um corte para escolher outra ou mudar a duração. O corte não sai do lugar, então a narração continua sincronizada."

[tour.editor.snap]
title = "Encaixar nas palavras"
body = "Cortes, aparas e bordas de legenda caem entre as palavras da narração, então um corte nunca come uma palavra. Segure Alt enquanto arrasta para posicionar livremente."

[tour.editor.undo]
title = "Desfazer e refazer"
body = "Ctrl+Z desfaz qualquer edição e Ctrl+Y refaz, e o corte se salva sozinho enquanto você edita. A parte 2 do tour, no mesmo botão, mostra a mixagem, as legendas, o enquadramento, o movimento nas imagens, as sugestões de corte e o render."

[tour.editor.retention]
title = "Retenção sobre o corte"
body = "Quando este vídeo está no YouTube e a conta do canal está conectada, Retenção desenha a curva de retenção do público sobre o corte e marca onde o público sai, com a cena e a frase que tocam ali. Clique numa queda para levar o cursor de reprodução até ela."

[tour.editor-more]
name = "Tour do editor, parte 2"

[tour.editor-more.mix]
title = "A mixagem"
body = "Clique no cabeçalho de uma faixa de áudio para ajustar o volume, ou use M e S para deixá-la muda ou tocar só ela. Selecione um trecho de áudio para dar entrada ou saída gradual. A atenuação abaixa a música enquanto o narrador fala; o cabeçalho da faixa de música define o quanto."

[tour.editor-more.captions]
title = "Legendas"
body = "As legendas seguem as palavras da narração. Selecione uma para editar no inspetor o texto, o tempo, o estilo e a cor em que acende a palavra falada; esta chave desliga todas."

[tour.editor-more.framing]
title = "16:9 ou 9:16"
body = "O formato do quadro do corte inteiro. Em 9:16, o clipe selecionado mostra a janela de recorte sobre a imagem: arraste-a para escolher o que fica à vista, ou escolha Ajustar ou Preencher no inspetor."

[tour.editor-more.motion]
title = "Movimento nas imagens"
body = "Uma imagem parada se move: um zoom ou pan lento enquanto aparece, para o vídeo não virar um slideshow. Selecione uma imagem para escolher o movimento e a intensidade no inspetor, ou varie todas de uma vez."

[tour.editor-more.performed]
title = "Clipes interpretados"
body = "Um clipe interpretado traz a sua própria atuação, então precisa ficar junto da narração de onde saiu. Selecione um para ver se está em sincronia, pô-lo de volta em sincronia ou cobrir um trecho com a imagem de uma cena."

[tour.editor-more.suggestions]
title = "Sugestões de corte"
body = "O Bardo dá uma nota a cada ponto onde uma frase termina, o narrador pausa ou a cena muda, e diz por quê. Aceite (A) ou rejeite (R) cada um na linha do tempo ou na lista que toma o lugar do inspetor; nada muda até você aceitar."

[tour.editor-more.render]
title = "Revisar e renderizar"
body = "Com o corte pronto, Revisar e renderizar leva você à etapa Render: as verificações, um arquivo por conta de rede e o render em si."

[tour.render]
name = "Tour do Render"

[tour.render.review]
title = "A revisão"
body = "Confira o corte como ele vai sair antes de renderizar: duração, formato do quadro, loudness da mixagem e legendas. Um número em âmbar merece uma olhada."

[tour.render.targets]
title = "Um arquivo por rede"
body = "Cada conta de rede do canal ganha o próprio arquivo, no preset dela: quadro, tamanho, codec, bitrate, duração máxima e loudness. Marque as que vão renderizar; as que ainda não têm arquivo ou estão desatualizadas já vêm marcadas."

[tour.render.gates]
title = "O que bloqueia e o que avisa"
body = "Uma verificação marcada Bloqueia deixa a rede fora do render até você corrigir, como um corte mais longo do que a rede aceita. Um aviso deixa renderizar, e a confirmação conta os avisos que ficam."

[tour.render.render]
title = "Renderizar"
body = "Renderizar pergunta mais uma vez, porque substitui o último arquivo de cada rede. Depois um único job renderiza todas em segundo plano, com o progresso aqui; cancele e retome depois se precisar."

[tour.render.last]
title = "O último arquivo"
body = "Como está o último arquivo da rede: renderizado deste corte, desatualizado porque o corte ou o preset mudou, ou ainda não renderizado. Mostrar na pasta abre o arquivo."

[tour.channels]
name = "Tour dos canais"

[tour.channels.list]
title = "Seus canais"
body = "Cada canal é um nicho para um mercado. Escolha um canal para editá-lo, ou crie um em Novo canal; pesquisas, ideias, projetos e contas de rede pertencem sempre a um canal."

[tour.channels.niche]
title = "Nicho, temas e estética"
body = "O nicho diz do que o canal trata, os temas listam os assuntos a que ele volta, um por linha, e as notas de estética dizem como os vídeos dele devem parecer. A pesquisa e as ideias partem do nicho e dos temas; ideias, roteiros e prompts de cena levam as notas junto."

[tour.channels.market]
title = "Idioma e país"
body = "O idioma em que roteiros e narração são escritos, e o país cujo público o canal quer alcançar. A pesquisa lê tendências e concorrência desse país."

[tour.channels.persona]
title = "Persona padrão"
body = "Quem narra os vídeos do canal, a menos que um projeto escolha outra persona. As personas ficam numa tela própria, e uma pode narrar vários canais."

[tour.channels.format]
title = "Shorts ou vídeos longos, e como são produzidos"
body = "Shorts são verticais, têm menos de um minuto e servem para todas as redes. Vídeos longos são 16:9 e têm de 8 a 10 minutos, para o YouTube. O formato define o tamanho dos roteiros, o formato das imagens e dos cortes, e o preset do YouTube. O modo de produção diz quais cenas viram clipes de IA e com qual modelo. Cada projeto pode escolher outro formato ou modo."

[tour.channels.defaults]
title = "Modelo de vídeo, legendas e transições"
body = "O modelo que anima as imagens das cenas do canal em clipes, o visual das legendas nos projetos novos e a cor em que acende a palavra falada, e a transição que o editor põe num corte. Qualquer cena pode escolher outro modelo, qualquer projeto outras legendas e qualquer corte outra transição."

[tour.channels.accounts]
title = "Contas de rede"
body = "Depois, dê ao canal suas contas em Contas: uma por rede, com o @, os padrões de metadados e o preset de render."

[tour.accounts]
name = "Tour das contas"

[tour.accounts.channel]
title = "Escolha o canal"
body = "As contas de rede pertencem a um canal. Escolha um aqui para ver as contas dele ao lado."

[tour.accounts.accounts]
title = "Uma conta por rede"
body = "Cada rede em que o canal publica tem uma conta, com o @ com que ele publica. Renders, exportações e envios para essa rede usam essa conta."

[tour.accounts.metadata]
title = "Padrões de metadados"
body = "Editar abre os padrões da conta: o idioma, a visibilidade, as tags e o rodapé de que cada post nessa rede parte. O Claude escreve os metadados de cada post sobre eles."

[tour.accounts.preset]
title = "Preset de render"
body = "Cada rede renderiza no próprio preset: quadro, tamanho, codec, bitrate, duração máxima e loudness. Mantenha o padrão da rede, ou mude qualquer um deles em Editar."

[tour.accounts.connect]
title = "Conecte a conta"
body = "Contas do YouTube, do TikTok e do X se conectam pelo navegador, e a do Instagram com um token que você cola, para o Bardo enviar vídeos e, em todas menos o X, ler os números. O cartão mostra a situação: não conectada, esperando o navegador, conectada como a conta, ou reconexão necessária."

[tour.accounts.add]
title = "Adicione uma rede"
body = "Adicione uma conta para cada rede ainda livre. Conectar uma pede as credenciais do app dessa rede, salvas uma vez em Configurações › Redes."

[tour.networks]
name = "Tour das redes"

[tour.networks.tab]
title = "Redes"
body = "Esta aba guarda os apps com que o Bardo entra em cada rede: um cliente OAuth do Google para o YouTube, um app da Meta para o Instagram, um app do TikTok for Developers para o TikTok, um app do X Developer Console para o X."

[tour.networks.why]
title = "Seus próprios apps"
body = "O Bardo não traz app próprio: você registra um em cada rede, então a cota, a tela de consentimento e qualquer revisão são suas. O guia mostra cada um, passo a passo."

[tour.networks.card]
title = "O ID e a chave secreta do app"
body = "Cole o ID (o TikTok chama de client key) e a chave secreta do site de desenvolvedores da rede, e salve. Troque-os aqui quando criar uma chave secreta nova."

[tour.networks.setup]
title = "Passo a passo"
body = "Não sabe por onde começar? Passo a passo abre uma tela com cada etapa no site de desenvolvedores da rede, um link direto para cada página e, no fim, os campos onde colar."

[tour.networks.audits]
title = "Auditorias e revisões"
body = "Cada rede pode revisar o seu app, para mais cota ou mais contas. Com o seu próprio app, quase nada disso se aplica. Auditorias e revisões abre uma tela que diz quando se aplica, o que a rede pede e o que o Bardo já oferece para isso."

[tour.networks.kept]
title = "Onde ficam guardados"
body = "As credenciais salvas vão para o Gerenciador de Credenciais do Windows, na sua conta do Windows, nunca para o banco de dados ou os logs do Bardo. O cartão mostra só os quatro últimos caracteres da chave secreta."

[tour.networks.connect]
title = "Depois, conecte"
body = "Com o app salvo, conecte a conta de cada canal em Contas."

[tour.publish]
name = "Tour da publicação"

[tour.publish.networks]
title = "Um post por rede"
body = "Cada conta de rede do canal ganha seu próprio post, a partir do arquivo renderizado. Marque as redes a exportar e escolha uma para ver o post ao lado da lista."

[tour.publish.metadata]
title = "Metadados e limites"
body = "Escrever metadados faz o Claude escrever o título, a descrição e as tags de cada rede a partir do roteiro e dos padrões da conta. Edite aqui: os contadores mostram os limites de cada rede, e um post acima deles não vai."

[tour.publish.youtube]
title = "Miniatura e capítulos"
body = "O post de um vídeo longo no YouTube também leva miniatura e capítulos. O Claude escreve o texto da miniatura e um prompt de fundo; escolha o fundo, posicione o texto e salve a imagem. Escrever capítulos divide a narração em partes nomeadas da barra de progresso."

[tour.publish.disclosure]
title = "Conteúdo sintético"
body = "Quando a voz do narrador é sintética e realista, cada rede pede que você declare isso. O Bardo lembra você aqui e marca a declaração na revisão do envio."

[tour.publish.upload]
title = "A revisão do envio"
body = "Revisar envio mostra exatamente o que vai para o YouTube, o Instagram, o TikTok ou o X: o arquivo, a conta, o texto, a miniatura, suas escolhas e quando vai ao ar. Nada é enviado até você confirmar."

[tour.publish.export]
title = "Exportar"
body = "Exportar grava uma pasta por rede com o arquivo renderizado e os metadados, para publicar à mão, em qualquer uma das cinco redes."

[tour.publish.post]
title = "O post"
body = "Quando ele estiver no ar, cole o link do post em Marcar como publicado, ou deixe o envio vincular por você. O Bardo então acompanha os números em Desempenho."

[tour.missed]
name = "Tour dos posts perdidos"

[tour.missed.list]
title = "Posts perdidos"
body = "Estes posts tinham um horário em que o Bardo ia publicá-los, e o Bardo estava fechado ou o computador desligado, então nada foi. Nada acontece com eles até você escolher."

[tour.missed.send]
title = "Postar agora"
body = "Posta na hora, como foi revisado."

[tour.missed.new-time]
title = "Novo horário"
body = "Dá a ele um horário mais tarde. Deixe o Bardo aberto nessa hora, ou ele volta a esperar aqui."

[tour.missed.cancel]
title = "Cancelar post"
body = "Nada vai para a rede. Para publicar depois, revise o envio de novo na etapa Publicação do projeto."

[tour.missed.later]
title = "Decidir depois"
body = "Fecha a lista por enquanto. Cada post também espera na etapa Publicação do projeto, com as mesmas três escolhas."

[tour.costs]
name = "Tour de Custos"

[tour.costs.month]
title = "O mês"
body = "Custos mostra um mês por vez, começando pelo atual. As setas voltam um mês e avançam de novo; os meses seguem o UTC, como os provedores cobram."

[tour.costs.spent]
title = "Quanto o mês gastou"
body = "Quanto o mês gastou nos seus provedores, quantos orçamentos estão perto ou além do limite e quantos modelos rodaram sem preço."

[tour.costs.budgets]
title = "Orçamentos"
body = "Defina um orçamento mensal para cada provedor pago. A partir de 80% a estimativa de uma geração avisa; quando um orçamento seria atingido, o Bardo pergunta antes de começar, e nunca interrompe uma tarefa no meio."

[tour.costs.rates]
title = "Tarifas"
body = "Quando o provedor não diz quanto a chamada custou, o Bardo usa as tarifas: altere uma, restaure a do próprio Bardo ou adicione um modelo. Um modelo sem tarifa conta como zero até você adicionar uma."

[tour.costs.channels]
title = "Gasto por canal"
body = "Quanto os vídeos de cada canal custaram no mês. Um mês sem gastos diz isso aqui."

[tour.costs.videos]
title = "Os vídeos mais caros"
body = "Os projetos de vídeo que mais custaram no mês, com o canal de cada um."

[tour.jobs]
name = "Tour de Tarefas"

[tour.jobs.panel]
title = "O painel Tarefas"
body = "Trabalho longo roda como tarefa enquanto você continua trabalhando. Este painel abre ao lado de qualquer tela e agrupa as tarefas: em execução, na fila, com falha e encerradas."

[tour.jobs.progress]
title = "Progresso"
body = "Uma tarefa em execução mostra o progresso. A tela dela mostra o resultado quando termina, então não precisa ficar olhando aqui."

[tour.jobs.cancel]
title = "Cancelar"
body = "Cancelar para uma tarefa em execução ou na fila e guarda o que ela fez para uma nova tentativa. Chamadas que o provedor já respondeu estão pagas."

[tour.jobs.retry]
title = "Tentar de novo"
body = "Uma falha passageira, como tempo esgotado, faz a tarefa tentar de novo sozinha, até quatro tentativas no total. Uma duradoura para a tarefa: resolva o que ela diz, e Tentar de novo continua de onde parou."

[tour.jobs.restart]
title = "Fechar o Bardo no meio de uma tarefa"
body = "Feche o Bardo quando quiser: na próxima vez que ele abrir, cada tarefa continua do último ponto salvo, e o trabalho que um provedor já fez não é pago duas vezes."

[tour.keys]
name = "Tour de Chaves de API"

[tour.keys.tab]
title = "Chaves de API"
body = "O Bardo trabalha com a sua própria conta em cada provedor de IA, uma chave por provedor. Você paga cada um diretamente, pelos preços dele."

[tour.keys.engine]
title = "Motor de decisão"
body = "Escolha o motor que ranqueia as ideias de vídeo e pontua as sugestões de corte. Ele chama com a chave do provedor dele, desta aba: o JEV, o único motor por enquanto, usa a chave da TypeSafe."

[tour.keys.card]
title = "Uma chave por provedor"
body = "Cada cartão diz o que o provedor faz por você. Cole a chave que você criou no site dele e salve; a BytePlus pede cinco campos, a chave dela e o seu bucket. Uma tela que precisa de uma chave que falta avisa."

[tour.keys.setup]
title = "Passo a passo"
body = "Ainda não tem a chave? Passo a passo abre uma tela que guia você pelo site do provedor, com um link direto para cada página, e termina no campo deste cartão para colar a chave."

[tour.keys.test]
title = "Testar chave"
body = "Com a chave salva, Testar chave faz a chamada mais barata que precisa dela e diz se funciona, ou o que há de errado: chave recusada, permissão faltando ou cota esgotada."

[tour.keys.kept]
title = "Onde as chaves ficam"
body = "As chaves vão para o Gerenciador de Credenciais do Windows, na sua conta do Windows, nunca para o banco de dados nem para os logs do Bardo."

[tour.keys.masked]
title = "Só os últimos caracteres"
body = "Uma chave salva nunca mais aparece: o cartão mostra os quatro últimos caracteres, e em todo texto que sai do Bardo a chave aparece mascarada. Trocar chave põe uma nova no lugar."

[tour.appearance]
name = "Tour de Aparência"

[tour.appearance.tab]
title = "Aparência"
body = "Como o Bardo aparece e fala, salvo no seu perfil assim que você muda."

[tour.appearance.layout]
title = "Layout"
body = "O Workspace tem barra lateral por pilar e cartões; o Studio é mais denso, com abas no topo e tabelas. Toda tela faz as mesmas coisas nos dois, e trocar mantém você onde está."

[tour.appearance.theme]
title = "Temas"
body = "Dez temas: claros, escuros, de alto contraste e de terminal. Cada cartão diz o contraste de texto que atende."

[tour.appearance.follow]
title = "Seguir o Windows"
body = "Troca entre um tema claro e um escuro, à sua escolha, quando o Windows troca de modo. Sempre o mesmo tema fica com o que você clicar."

[tour.appearance.language]
title = "Idioma da interface"
body = "As palavras do próprio Bardo, este guia incluído, em português ou inglês. O que o Claude escreve segue o idioma de cada canal."

[tour.appearance.tours]
title = "Tours em telas novas"
body = "Marca o Tour desta tela de uma tela como Novo até você fazer ou pular o tour dela. Os tours nunca começam sozinhos."

[tour.metrics-sync]
name = "Tour de Métricas"

[tour.metrics-sync.tab]
title = "Métricas"
body = "O Bardo lê os números dos seus posts em cada rede numa sincronização: os números públicos do YouTube com a sua chave da Data API, o resto pelas contas conectadas."

[tour.metrics-sync.on-start]
title = "Sincronizar ao abrir"
body = "Quando o Bardo abre, ele sincroniza se a verificação mais antiga passou deste tempo, ou nunca. Sincronizar agora, em Desempenho, sempre funciona."

[tour.metrics-sync.where]
title = "Onde aparecem"
body = "Os números aparecem em Desempenho, e a primeira semana de cada post alimenta o ranqueamento de novas ideias."

[tour.background-agent]
name = "Tour do agente em segundo plano"

[tour.background-agent.tab]
title = "Publicação"
body = "O próprio Bardo posta os Reels do Instagram no horário marcado. Aqui você escolhe se isso também acontece com o Bardo fechado."

[tour.background-agent.switch]
title = "Publicar com o Bardo fechado"
body = "Ligado, um agente leve inicia quando você se conecta ao Windows e envia os Reels agendados em segundo plano. Desligado, ele é removido."

[tour.background-agent.status]
title = "Está rodando?"
body = "Aqui aparece se o agente está rodando agora. Se estiver ligado mas parado, inicie por aqui ou conecte-se de novo ao Windows."

[tour.background-agent.limits]
title = "Do que ele precisa"
body = "O computador precisa estar ligado e você conectado. Com o Bardo aberto, o próprio Bardo envia os posts e o agente espera."

[tour.about]
name = "Tour de Sobre"

[tour.about.version]
title = "Versão"
body = "A versão do Bardo neste computador. Informe-a quando relatar um problema."

[tour.about.updates]
title = "Atualizações"
body = "O Bardo procura uma versão mais nova ao abrir e uma vez por dia, a menos que você desligue. Como ele se atualiza depende de como foi instalado: esta seção diz o que fazer."

[tour.about.privacy]
title = "Privacidade e YouTube"
body = "O Bardo só usa o YouTube depois que você aceita a política de privacidade dele. Leia-a aqui, encontre os termos do YouTube e a política de privacidade do Google, e apague quando quiser o que o Bardo guardou do YouTube."

[tour.about.ffmpeg]
title = "FFmpeg"
body = "O Bardo lê, pré-visualiza e renderiza vídeo com o FFmpeg, que vem junto com ele. A licença e o código-fonte estão a um clique."

[tour.about.notices]
title = "Avisos de terceiros"
body = "As bibliotecas de código aberto com que o Bardo é feito, e as licenças delas."

[tour.about.diagnostics]
title = "Diagnóstico"
body = "Quando algo der errado, exporte aqui um arquivo de diagnóstico e anexe-o a uma issue. Chaves, tokens e nomes de contas saem mascarados, e nada é enviado a lugar nenhum."

[tour.backup]
name = "Tour do backup"

[tour.backup.back_up]
title = "Fazer backup"
body = "Salva seus canais, projetos e configurações num arquivo .zip. Marque Incluir mídias para levar os arquivos dos projetos também."

[tour.backup.automatic]
title = "Backups automáticos"
body = "Toda semana o Bardo faz sozinho um backup do banco de dados e guarda os quatro últimos. Qualquer um pode ser restaurado daqui."

[tour.backup.restore]
title = "Restaurar"
body = "Escolha um backup, veja o que ele tem e confirme: o Bardo substitui os dados e reinicia. Chaves e logins continuam neste computador."

[tour.backup.settings_file]
title = "Arquivo de configurações"
body = "Leva suas chaves, preferências, personas e canais para outra cópia do Bardo num arquivo protegido por senha. Você marca o que vai, e de novo o que entra."

