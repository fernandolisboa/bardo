# Built-in prices of the models Bardo calls, in US dollars, as text so they
# stay exact: per million tokens, per thousand characters, per second of
# video, or per hour of audio.
#
# Checked on 2026-10-02 against each provider's published API prices. The
# user can change any of them, or add models, on the costs screen; a price
# changed here reaches every user who has not changed it.
#
# Layout: [provider."model"] with one price per meter (input_tokens,
# output_tokens, image_tokens, characters, video_seconds, audio_seconds,
# posts; audio is priced per hour, posts one by one). A model covers
# every model whose name starts with it, so `jev` covers `jev-1.13.0`, and
# an empty model covers all of the provider's models.

# Anthropic, standard API prices.
[claude."claude-opus-5-5"]
input_tokens = "4.00"
output_tokens = "20.00"

# ElevenLabs bills credits from the plan; this is the pay-as-you-go API
# price of Multilingual v2 and v3.
[elevenlabs."eleven_multilingual_v2"]
characters = "0.10"

# Forced alignment of a recording the user made is billed like ElevenLabs'
# speech-to-text, per hour of audio.
[elevenlabs."forced_alignment"]
audio_seconds = "0.22"

# A capture's speech (checked on 2026-10-23), per hour of audio: Scribe
# speech-to-text checks it follows the script (US$ 0.22 per hour), the
# Voice Changer gives it the persona's voice and the Voice Isolator cleans
# the user's own (US$ 0.12 per minute each).
[elevenlabs."scribe_v2"]
audio_seconds = "0.22"

[elevenlabs."eleven_multilingual_sts_v2"]
audio_seconds = "7.20"

[elevenlabs."audio_isolation"]
audio_seconds = "7.20"

# ElevenLabs Music over the API: US$ 0.15 per minute of music (checked on
# 2026-10-19), per hour here like the other audio.
[elevenlabs."music_v1"]
audio_seconds = "9.00"

# Google Gemini API, paid tier. Images are priced per output image token
# (a 2K image is 1,680 of them); reasoning is billed as text output.
[gemini."gemini-3.1-flash-image"]
input_tokens = "0.50"
output_tokens = "3.00"
image_tokens = "60.00"

# Google bills Veo clips per second of video, by model and resolution; the
# soundtrack Veo always makes is included. Gemini Omni Flash bills output
# tokens, 5,792 per second of 720p video at $17.50 per million; Google
# publishes no figure for its upscaled 1080p, so that has no rate. Google
# quotes nothing before a clip, so these prices are what gets recorded.
[gemini."veo-3.1-generate-preview/720p"]
video_seconds = "0.40"

[gemini."veo-3.1-generate-preview/1080p"]
video_seconds = "0.40"

[gemini."veo-3.1-fast-generate-preview/720p"]
video_seconds = "0.10"

[gemini."veo-3.1-fast-generate-preview/1080p"]
video_seconds = "0.12"

[gemini."veo-3.1-lite-generate-preview/720p"]
video_seconds = "0.05"

[gemini."veo-3.1-lite-generate-preview/1080p"]
video_seconds = "0.08"

[gemini."gemini-omni-1.1-flash/720p"]
video_seconds = "0.10136"

# Higgsfield bills each clip per second of video, by model; these are the
# published API prices as of 2026-09-16. The price of a clip also depends on
# resolution and sound, so Higgsfield's own quote (asked before every clip)
# is what gets recorded; these estimate a clip before it starts. Seedance
# 2.0, Wan 2.6 and Hailuo 2.3 have no published per-second price: add one on
# the costs screen to have them estimated.
[higgsfield."kling-video/v3.0/"]
video_seconds = "0.112"

[higgsfield."kling-video/v2.6/"]
video_seconds = "0.07"

[higgsfield."kling-video/v2.5-turbo/"]
video_seconds = "0.042"

[higgsfield."minimax/h3/"]
video_seconds = "0.13"

# Take models (performed takes), per second of take. Kling 3.0 Motion
# Control at 1080p is Kling's list price (2026-10-22). Seedance 2.5 Video
# Edit has no published per-second price on Higgsfield: these come from
# ModelArk's token rates at 24 fps, counting the input and output seconds
# (US$ 6.40 per million tokens at 480p, US$ 7.00 at 1080p). Higgsfield's own
# quote, asked before every take, is what gets recorded.
[higgsfield."kling-video/v3/motion-control/pro"]
video_seconds = "0.168"

[higgsfield."bytedance/seedance-2.5/video-edit/480p"]
video_seconds = "0.123"

[higgsfield."bytedance/seedance-2.5/video-edit/1080p"]
video_seconds = "0.680"

# Kling bills each clip per second of video from prepaid resource packages,
# by model and resolution, with sound off; these are its published list
# prices (checked on 2026-10-20, 1 unit = US$ 0.14). Kling quotes nothing
# before a clip, so these prices are what gets recorded.
[kling."kling-3.0/720p"]
video_seconds = "0.084"

[kling."kling-3.0/1080p"]
video_seconds = "0.112"

[kling."kling-2.6/720p"]
video_seconds = "0.042"

[kling."kling-2.6/1080p"]
video_seconds = "0.07"

[kling."kling-2.5-turbo/720p"]
video_seconds = "0.042"

[kling."kling-2.5-turbo/1080p"]
video_seconds = "0.07"

# TypeSafe charges JEV's input tokens only.
[typesafe."jev"]
input_tokens = "0.042"
output_tokens = "0"

# The X API is paid per use, from credits bought ahead (checked on
# 2026-10-14). X bills each post it creates, more when its text holds a
# link; the media upload is not billed.
[x."post"]
posts = "0.015"

[x."post-with-link"]
posts = "0.20"
