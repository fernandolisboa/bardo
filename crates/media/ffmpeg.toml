# The ffmpeg build Bardo bundles and tests against (ADR-0007).
#
# LGPL (v3), shared libraries, from BtbN/FFmpeg-Builds. The month-end
# autobuild is kept for two years upstream; Bardo keeps its own copy of
# both archives and of the matching source as assets of the `ffmpeg-<version>`
# release of its repository (`cargo xtask mirror-ffmpeg`, issue #135).
# `cargo xtask fetch-ffmpeg` downloads the archive for this platform (from
# the mirror when the upstream link is gone), checks its SHA-256 and
# unpacks `bin/` into `.ffmpeg/`. A new version needs a new mirror release.
version = "8.1.3"
mirror = "https://github.com/fernandolisboa/bardo/releases/download/ffmpeg-8.1.3"

[windows-x86_64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1.zip"
sha256 = "3e47bda1607740550141e37c0e49d1e5182b34699f15adfd137ee266d346811a"

# Development in Linux containers only; Bardo ships for Windows. Static,
# because the shared Linux build needs its lib/ folder on the loader path.
[linux-x86_64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-lgpl-8.1.tar.xz"
sha256 = "dfa863a00ca81f1bdf58a372b18cff4820f0017e55de32778de8ecd8ed92a02e"

# The FFmpeg source both builds were made from (`n8.1.3-9-g29e619e767`),
# offered with the installer as the LGPL asks, and how they were built.
[source]
url = "https://github.com/FFmpeg/FFmpeg/archive/29e619e767.tar.gz"
file = "ffmpeg-n8.1.3-9-g29e619e767-source.tar.gz"
build = "https://github.com/BtbN/FFmpeg-Builds/tree/autobuild-2026-09-30-13-08"
