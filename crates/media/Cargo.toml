[package]
name = "bardo-media"
description = "ffmpeg-based probing, proxies, preview and render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bardo-domain.workspace = true
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Reads, scales and writes the pictures of composed product shots (#278);
# pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Draws the control videos' mesh and figures (#191); pure Rust.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
