[package]
name = "bardo-storage"
description = "SQLite persistence, migrations, secrets access and the background agent's task."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bardo-domain.workspace = true
dirs.workspace = true
jiff.workspace = true
# The online backup API copies the database while it is in use (#143).
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true
zip.workspace = true
# A deleted project's or video's folder goes to the Recycle Bin (#336).
trash = "5"

[target.'cfg(windows)'.dependencies]
# Whether a folder's drive is removable, and how much its bin holds (#336).
sysinfo = { version = "0.31", default-features = false, features = ["disk"] }
windows-registry = "0.6"
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
