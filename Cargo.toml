[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bardo-domain = { path = "crates/domain" }
bardo-media = { path = "crates/media" }
bardo-ai = { path = "crates/ai" }
bardo-publish = { path = "crates/publish" }
bardo-storage = { path = "crates/storage" }
bardo-app = { path = "crates/app" }
bardo-vision = { path = "crates/vision" }

# GPUI family: pinned exactly (see issue #5). Only `bardo-ui` may depend on it;
# `cargo xtask lint-deps` enforces that in CI.
gpui-kit = "=0.7.0"

anyhow = "1"
base64 = "0.22"
dirs = "6"
form_urlencoded = "1"
humantime = "2"
jiff = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
windows-version = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The settings file's key derivation (issue #162) runs 64 MiB of Argon2:
# seconds unoptimized, so it is optimized in debug builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Control videos (#191) draw every frame of a take, which unoptimized code
# does too slowly to try out or test.
[profile.dev.package.bardo-media]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3
