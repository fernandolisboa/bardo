# Spike for issue #277: cuts a product out of its photo with salient-object
# models run from Rust through ONNX Runtime, and measures them. Not part of
# the app: it has its own workspace and lock file so `cargo test` at the
# root never builds it. Results and the decision: docs/spikes/product-cutout.md.
[package]
name = "cutout-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace]

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
toml = "0.9"
# The pin of ADR-0024, as `bardo-vision` has it.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "directml"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pixel loops read better indexed.
needless_range_loop = "allow"

[profile.release]
debug = "line-tables-only"
