# Sources and files of the product-cutout spike (issue #277), each pinned:
# upstream code by commit, weights by SHA-256 (and by revision where the
# host has one). tools/convert.py downloads them, checks every hash, and
# writes the [[model]] files with their weights kept as float16, as
# crates/vision/models.toml's are. This is also the draft of the entries
# the vision models manifest would gain; docs/spikes/product-cutout.md
# says which.
#
# Licenses, as each source states them:
# - U²-Net: the repository is Apache-2.0; its README links to the weight
#   files on a file host. Trained on DUTS-TR.
# - IS-Net: the repository says its "code and evaluation metric use Apache
#   License 2.0"; its README links to the weight files on a file host and
#   does not say what the general-use weights were trained on. DIS5K, the
#   set of its academic weights, has terms of its own (non-commercial
#   research and education).
# - BiRefNet: the repository is MIT, and each model's page, which holds
#   the weight file, states MIT; the general-use weights were trained on
#   DIS5K among other sets.
# RMBG (CC BY-NC) is not here and must never be added.

