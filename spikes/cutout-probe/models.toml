# The files tools/convert.py writes. `input` is height and width; `scale`,
# `mean` and `std` are how each upstream prepares a photo; `range` is what
# its own inference does to the output (U²-Net and IS-Net stretch it from
# its smallest to its largest value). `sha256` and `size` are those of the
# files the spike's numbers were measured on. The conversion writes the
# same bytes on every run so far (the container's and the workflow's),
# and stops when it does not.

[[model]]
file = "u2netp_320x320.onnx"
sha256 = "fbd20e309fb80d8a7884900c706d38bb3aaf0333538a38d27b2d8a4d794a7975"
size = 2387844
from = "u2netp"
input = [320, 320]
scale = "max"
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]
range = "min-max"

