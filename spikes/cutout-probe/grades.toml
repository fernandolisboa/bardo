# Grades given by eye to every cutout of the 25 test photos, one model
# at a time, looking at the cutout over the probe's flat backdrop at the
# size of the photo. `tools/confidence.py` reads them.
#
# good    nothing a viewer would notice
# usable  the product is whole and reads as itself, with a defect seen on
#         a close look: a soft or fringed edge, a small hole, a bit of the
#         old background kept (clear glass still filled with it)
# bad     part of the product missing or see-through (the bite a finger
#         leaves in its outline too), the wrong object, or background (a
#         hand, a table) kept where anyone notices

# The photos with a real scene behind the product (a table, a cloth, a
# shelf, a box, a hand). The other fifteen have a plain or seamless
# background, as a product photo made for a shop has.
scene = ["glass-1", "reflective-2", "reflective-3", "white-1", "white-3", "fine-1", "fine-3", "hand-1", "hand-2", "hand-3"]

