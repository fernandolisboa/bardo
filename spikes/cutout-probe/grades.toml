# Grades given by eye to every cutout of the 25 test photos, one model
# at a time, looking at the cutout over the probe's flat backdrop at the
# size of the photo. `tools/confidence.py` reads them.
#
# good    nothing a viewer would notice
# usable  the product is whole and reads as itself, with a defect seen on
#         a close look: a soft or fringed edge, a small bite or hole, a
#         bit of the old background kept
# bad     part of the product missing or see-through, the wrong object,
#         or background (a hand, a table) kept where anyone notices

[u2netp_320x320]
box-1 = "usable"
box-2 = "bad"
bottle-1 = "usable"
bottle-2 = "bad"
bottle-3 = "bad"
glass-1 = "usable"
glass-2 = "usable"
glass-3 = "usable"
glass-4 = "usable"
reflective-1 = "usable"
reflective-2 = "usable"
reflective-3 = "usable"
white-1 = "bad"
white-2 = "usable"
white-3 = "usable"
white-4 = "bad"
fine-1 = "usable"
fine-2 = "bad"
fine-3 = "bad"
hand-1 = "bad"
hand-2 = "bad"
hand-3 = "bad"
plain-1 = "usable"
plain-2 = "usable"
plain-3 = "usable"

