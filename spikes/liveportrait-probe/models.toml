# Sources of the LivePortrait spike (issue #242), each pinned: upstream code
# by commit, weights by Hugging Face revision and SHA-256. tools/convert.py
# downloads them, checks every hash and writes the [[onnx]] files.
#
# Licenses: LivePortrait's code and weights are MIT. InsightFace's models
# (`insightface/` in the same Hugging Face repository) are for
# non-commercial research only: Bardo never ships or runs them. Only
# tools/compare_crop.py loads them, on the developer's computer, to measure
# the MediaPipe crop against the original one.

