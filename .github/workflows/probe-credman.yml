# Throwaway probe for #200; removed before merge.
name: Probe Credential Manager

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test -p bardo-storage --locked --no-run
      - name: Contracts alone, over and over
        shell: bash
        run: |
          for mode in all connection contract all; do
            PROBE_CONTRACTS=$mode cargo test -p bardo-storage --locked --lib -- --exact secrets::tests::probe_200_contracts --nocapture > run.log 2>&1 || true
            grep -E "PROBE200|test result" run.log || true
            grep -E -A3 "panicked" run.log | grep -E "panicked|left|right" | sort | uniq -c | sort -rn | head -12 || true
          done
      - name: The three tests alone, in a loop
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 60); do
            if ! cargo test -p bardo-storage --locked --lib secrets::tests::credential_manager > run.log 2>&1; then
              fails=$((fails+1)); grep -E -A3 "panicked" run.log | grep -E "panicked|left|right" || true
            fi
          done
          echo "alone failures: $fails of 60"
      - name: Contracts over and over inside the suite
        shell: bash
        run: |
          for i in 1 2 3; do
            PROBE_CONTRACTS=all cargo test -p bardo-storage --locked --lib -- --nocapture > run.log 2>&1 || true
            grep -E "PROBE200 mode|test result" run.log || true
            grep -E -A3 "panicked" run.log | grep -E "panicked|left|right" | sort | uniq -c | sort -rn | head -12 || true
          done
