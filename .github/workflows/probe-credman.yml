# Throwaway probe for #200; removed before merge.
name: Probe Credential Manager

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test -p bardo-storage --locked --no-run
      - name: Probe inside the suite
        shell: bash
        run: |
          for i in $(seq 1 12); do
            PROBE_IN_SUITE=1 cargo test -p bardo-storage --locked --lib -- --nocapture > run.log 2>&1 || true
            echo "=== run $i"; grep -E "PROBE200|panicked|test result" run.log; grep -E -A3 "panicked" run.log | grep -E "left|right"
          done
