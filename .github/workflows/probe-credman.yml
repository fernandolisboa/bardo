# Throwaway probe for #200; removed before merge.
name: Probe Credential Manager

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        noise: [console, console, console, none, none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test -p bardo-storage --locked --no-run
      - name: Start the noise
        shell: pwsh
        run: |
          "job: pid=$PID session=$((Get-Process -Id $PID).SessionId) logon=$(whoami /logonid)"
          $script = (Resolve-Path e2e/probe/noise.ps1).Path
          if ("${{ matrix.noise }}" -eq "console") {
            # Runs in the signed-in console session, a logon of its own.
            schtasks /Create /F /TN BardoNoise /SC ONCE /ST 23:59 /IT /RU "$env:USERDOMAIN\$env:USERNAME" /TR "pwsh -NoProfile -WindowStyle Hidden -File `"$script`" -Tag console"
            schtasks /Run /TN BardoNoise
          } elseif ("${{ matrix.noise }}" -eq "job") {
            Start-Process pwsh -ArgumentList "-NoProfile","-File","`"$script`"","-Tag","job" -WindowStyle Hidden
          }
          Start-Sleep 10
          Get-Content "$env:TEMP\bardo-noise-*.log" -ErrorAction SilentlyContinue
          exit 0
      - name: The suite, as CI runs it
        shell: bash
        run: |
          fails=0; stale=0
          for i in $(seq 1 10); do
            failed=0
            cargo test -p bardo-storage --locked --lib > run.log 2>&1 || failed=1
            if [ $failed = 1 ] ; then
              [ $failed = 1 ] && fails=$((fails+1)); stale=$((stale+1))
              echo "=== suite $i failed=$failed"; grep -E -A4 "panicked" run.log || true
            fi
          done
          echo "noise=${{ matrix.noise }} suite failures: $fails, runs with a wrong read: $stale, of 10"
      - name: Noise log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:TEMP\bardo-noise-*.log" -ErrorAction SilentlyContinue
          exit 0
