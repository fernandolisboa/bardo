name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests, GPUI lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: Rust 1.100 moved build scripts' output folders, and ort's
      # build script then copies onnxruntime's DLLs into folders that do
      # not exist and fails. Back to stable once ort follows the layout.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: GPUI dependency lint (only bardo-ui may depend on GPUI)
        run: cargo xtask lint-deps
      - name: Cache the pinned ffmpeg
        uses: actions/cache@v4
        with:
          path: .ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/media/ffmpeg.toml') }}
      - name: Fetch the pinned ffmpeg (ADR-0007)
        run: cargo xtask fetch-ffmpeg
      - name: Cache the pinned vision models
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('crates/vision/models.toml') }}
      - name: Fetch the pinned vision models (ADR-0024)
        run: cargo xtask fetch-models
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, the look job's showcase build
        run: cargo clippy -p bardo-ui --all-targets --locked --features showcase -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build app
        run: cargo build -p bardo-ui --locked
